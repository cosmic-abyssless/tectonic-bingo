# Continuous backups, as an overlay on the base stack:
#
#   docker compose -f docker-compose.yml -f deploy/compose.backup.yml up -d
#
# litestream ships every database change to the bucket within about a second; backup copies new uploads nightly. Both
# read their settings (bucket, credentials) from the backup env file, deploy/backup.env by default (BACKUP_ENV_FILE
# overrides it), which is required: the stack refuses to start rather than run unprotected without saying so.
#
# Restoring is deploy/restore.sh; proving that it works is deploy/restore-drill.sh. Both are described in deploy/README.md.

services:
  litestream:
    image: litestream/litestream:0.5.17
    # The same user as the app (uid 1000): it must be able to write next to the database (its own bookkeeping directory
    # and the WAL index), and everything it creates there must stay writable by the app.
    user: "1000:1000"
    restart: unless-stopped
    command: ["replicate", "-config", "/etc/litestream.yml"]
    env_file:
      - ${BACKUP_ENV_FILE:-./deploy/backup.env}
    volumes:
      - ${DATA_DIR:-./.docker-data}/sqlite:/data/sqlite
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      init-data:
        condition: service_completed_successfully
    # On stop it makes a last sync, so a deploy or reboot never leaves the newest changes behind.
    stop_grace_period: 30s

  backup:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    entrypoint: ["sh", "/deploy/backup-loop.sh"]
    env_file:
      - ${BACKUP_ENV_FILE:-./deploy/backup.env}
    volumes:
      # Read-only: a bug or a bad command here must never be able to touch the live uploads.
      - ${DATA_DIR:-./.docker-data}/uploads:/data/uploads:ro
      - ./deploy:/deploy:ro
    stop_grace_period: 30s
