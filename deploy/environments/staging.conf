# Staging's settings, sourced by deploy/deploy.sh (plain shell assignments). Secrets are NOT here: they are in
# /srv/tectonic/env/staging.env on the box (see deploy/env/staging.env.example).

TB_HOSTS="staging.tectonic.bingo"

# Publicly reachable, and dev-login is on behind it, so the whole site (except /health, for uptime checks) asks for one
# shared password. The username and bcrypt hash are in /srv/tectonic/env/staging.basic-auth.
TB_BASIC_AUTH=1

# Staging has its own backups under its own prefix, so a restore drill or a refresh from production is always possible.
TB_BACKUP=1

# Staging is rarely under load; production's screenshot reader gets the machine's CPUs first.
TB_OCR_CPUS=1
TB_OCR_MEMORY=1500m
TB_OCR_CONCURRENCY=1
