# Production's settings, sourced by deploy/deploy.sh (plain shell assignments). Secrets are NOT here: they are in
# /srv/tectonic/env/production.env on the box (see deploy/env/production.env.example).

# The names Caddy serves, space separated. A name with a scheme (http://host:port) is served exactly as written, which is
# how the local test avoids certificates.
TB_HOSTS="tectonic.bingo www.tectonic.bingo"

# Caddy asks for a password on the whole site except /health. Production is public.
TB_BASIC_AUTH=0

# Continuous database and uploads backups (deploy/README.md, "Backups and restoring"). Production must have them.
TB_BACKUP=1

# The screenshot reader's share of the machine: a burst of screenshots slows analysis, never the site.
TB_OCR_CPUS=2
TB_OCR_MEMORY=2g
TB_OCR_CONCURRENCY=1
