<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tectonic Bingo</title>
    <!-- Favicon set (public/). The logo is black and red, and a dark tab bar swallows the black, so dark mode gets the
         same logo on a light plate; the .ico is the fallback for browsers that ignore the media query. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Sets data-color-scheme before first paint, avoiding a flash of the
         wrong scheme — the React-driven equivalent (core/ui/colorScheme.ts's
         useSyncColorSchemeAttribute) only runs after the bundle loads and
         hydrates, which is too late. Mirrors core/ui/preferences.ts's exact
         storage format (plain string, "pref:" + key, no JSON encoding). -->
    <script>
      try {
        var p = localStorage.getItem("pref:colorScheme");
        if (p === "light" || p === "dark") document.documentElement.setAttribute("data-color-scheme", p);
      } catch (e) {}
    </script>
    <!-- Comic-lettering display font for the "comic" theme (themes/comic/font.ts).
         Loaded globally here since it's a build-time asset, same as any other
         web font — but only the comic theme's own components reference it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@100..900&family=Bangers&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
