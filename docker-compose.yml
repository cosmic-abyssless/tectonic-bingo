# The site as containers: the app behind Caddy. This file is the local stack (`docker compose up --build`, then
# http://localhost:8080); the production and staging stacks reuse the same image with their own settings, see deploy/.
#
# Everything that varies is a variable, with a local default:
#   DATA_DIR      where the database and uploads live on the host       ./.docker-data
#   SITE_ADDRESS  the address Caddy serves                              http://localhost
#   HTTP_PORT     host port for plain HTTP (local only)                 8080
#   IMAGE_TAG     which build of the image to run                       local
#   ENV_FILE      file of app settings and secrets (see .env.docker.example)

services:
  api:
    build:
      context: .
      args:
        SENTRY_RELEASE: ${SENTRY_RELEASE:-local}
    image: tectonic-bingo:${IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    env_file:
      - path: ${ENV_FILE:-.env.docker}
        required: false
    environment:
      SENTRY_RELEASE: ${SENTRY_RELEASE:-local}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    volumes:
      - ${DATA_DIR:-./.docker-data}/sqlite:/data/sqlite
      - ${DATA_DIR:-./.docker-data}/uploads:/data/uploads
    command: ["api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
