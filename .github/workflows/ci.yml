name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # onnxruntime-node's install step would otherwise download its CUDA/TensorRT GPU providers from NuGet on every
  # `npm ci`: large, unused (the OCR runs on the CPU runtime the npm package already ships), and a network call that
  # can time out and fail the job (it did, on main, 2026-09-23).
  ONNXRUNTIME_NODE_INSTALL: skip

# A newer push to a pull request makes the older run pointless. Runs on main are never cancelled, so every commit on
# main keeps a finished result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but Markdown changed. A pull request (or push to main) that only touches .md files skips every job
  # below: a skipped job counts as passed for the required checks, and CI on main still finishes "success", so the
  # production deploy's "CI passed on main" gate is unaffected.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks + builds both workspaces (server: tsc; client: tsc + vite build).
      - run: npm run build

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server unit tests (vitest). No .env needed — every env-dependent code
      # path in src/ falls back to a safe default or is exercised via mocks.
      - run: npm test
      # The client's unit tests (vitest) aren't part of the root `npm test`, which only runs the server's.
      - run: npm test --workspace=client

  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches a schema.ts edit whose migration was never generated/committed:
      # regenerating against the current schema should produce no new files.
      - name: Check schema.ts matches the committed migrations
        working-directory: server
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts changed without a matching migration. Run 'npm run db:generate --workspace=server' and commit the result."
            git status --porcelain drizzle
            git diff drizzle
            exit 1
          fi
      # Catches a broken/malformed migration by replaying every committed
      # migration against a brand-new database, the same way a real deploy would.
      - name: Apply all migrations to a fresh database
        working-directory: server
        run: DB_PATH=./data/ci-check.db npx drizzle-kit migrate

  # Builds the deployable image and starts it on an empty database, so a change that breaks the Dockerfile, the
  # entrypoint, the runtime dependencies or startup is caught on the pull request rather than on a deploy.
  # The server's infrastructure code (infra/). Needs no credentials: it only checks that the configuration is formatted and valid,
  # so a broken edit is caught on the pull request rather than on the day the box has to be rebuilt.
  infra:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false -input=false
        working-directory: infra
      - run: tofu validate
        working-directory: infra
      - run: shellcheck -x --severity=warning infra/*.sh

  # The image is built in three jobs that run at the same time (each from the same layer cache), rather than built once and
  # handed over: moving a large image between jobs would cost about what the parallelism saves.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tectonic-bingo:ci
          build-args: SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          # Only main writes the cache (pull requests read it, and a cache is readable from the base branch): exporting it
          # costs about 12 s, and a pull request's own layers are rarely reused.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,ignore-error=true' || '' }}
      - run: bash deploy/smoke-test.sh tectonic-bingo:ci
      # Destroys a database and its uploads and gets them back from a local stand-in for the bucket: proves the backup and
      # restore tooling (Litestream, rclone, deploy/restore.sh) still works with this build, not just that it once did.
      - run: bash deploy/restore-drill.sh tectonic-bingo:ci
      # The deploy scripts are what decide whether a release drops requests, so they are tested like code.
      - run: shellcheck -x --severity=warning deploy/*.sh infra/*.sh
      - run: bash deploy/test-ssh-entry.sh

  image-zero-downtime:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tectonic-bingo:ci
          build-args: SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Half of the zero-downtime test (the other half is image-deploy-guards). Real deploy.sh, Caddy and containers: deploys,
      # deploys again, tries broken builds, and rolls back, while a probe requests the site continuously. Passes only if not
      # one request failed and the live version was right every time.
      - run: bash deploy/test-zero-downtime.sh tectonic-bingo:ci
        env:
          ZD_PART: probe

  image-deploy-guards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tectonic-bingo:ci
          build-args: SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
      # The other half of the zero-downtime test: the guards that protect production (what staging runs, the password, the
      # backup services, the emergency path, never going back to an older commit), on their own runner beside the probe half.
      - run: bash deploy/test-zero-downtime.sh tectonic-bingo:ci
        env:
          ZD_PART: guards
