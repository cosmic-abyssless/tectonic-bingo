name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Runs on main are never cancelled: the promote workflow
# needs a finished, green run on the exact commit it deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks + builds both workspaces (server: tsc; client: tsc + vite build).
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server unit tests (vitest). No .env needed — every env-dependent code
      # path in src/ falls back to a safe default or is exercised via mocks.
      - run: npm test
      # The client's unit tests (vitest) aren't part of the root `npm test`, which only runs the server's.
      - run: npm test --workspace=client

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches a schema.ts edit whose migration was never generated/committed:
      # regenerating against the current schema should produce no new files.
      - name: Check schema.ts matches the committed migrations
        working-directory: server
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts changed without a matching migration. Run 'npm run db:generate --workspace=server' and commit the result."
            git status --porcelain drizzle
            git diff drizzle
            exit 1
          fi
      # Catches a broken/malformed migration by replaying every committed
      # migration against a brand-new database, the same way a real deploy would.
      - name: Apply all migrations to a fresh database
        working-directory: server
        run: DB_PATH=./data/ci-check.db npx drizzle-kit migrate
